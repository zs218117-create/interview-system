# 腾讯云 Lighthouse 生产编排：app + postgres + Caddy(:80)
# 用法见 DEPLOY-CN.md / scripts/deploy-lighthouse.sh
# 密钥放在 .env（勿提交 Git）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-interview_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview} -d ${POSTGRES_DB:-interview_system}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-interview_system}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?请在 .env 设置 NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?请在 .env 设置 NEXTAUTH_SECRET}
      RUN_SEED: ${RUN_SEED:-false}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # 若已备案域名且要 HTTPS，可再映射 443，并改 Caddyfile
      # - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
